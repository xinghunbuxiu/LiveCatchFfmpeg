name: Build FFmpeg Platform

on:
  workflow_call:
    inputs:
      ffmpeg_version:
        description: "FFmpeg version"
        required: true
        type: string
      target:
        description: "Build target"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.target }}
    runs-on: ${{ inputs.target == 'windows-x64' && 'ubuntu-24.04' || inputs.target == 'macos-arm64' && 'macos-14' || 'macos-15-intel' }}
    env:
      FFMPEG_VERSION: ${{ inputs.ffmpeg_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Windows cross-build dependencies
        if: ${{ inputs.target == 'windows-x64' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mingw-w64 yasm nasm pkg-config curl xz-utils zip

      - name: Install macOS build dependencies
        if: ${{ startsWith(inputs.target, 'macos-') }}
        run: brew install nasm pkg-config

      - name: Build Windows x64
        if: ${{ inputs.target == 'windows-x64' }}
        env:
          TARGET: x86_64-w64-mingw32
        run: bash ./scripts/build-windows-x64.sh

      - name: Build macOS arm64
        if: ${{ inputs.target == 'macos-arm64' }}
        run: bash ./scripts/build-macos.sh arm64

      - name: Build macOS x64
        if: ${{ inputs.target == 'macos-x64' }}
        run: bash ./scripts/build-macos.sh x86_64

      - name: Verify runtime
        run: bash ./scripts/verify-runtime.sh "${{ inputs.target }}"

      - name: Package
        run: bash ./scripts/package-runtime.sh "${{ inputs.target }}"

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-package-${{ inputs.target }}
          path: dist/*.zip
          if-no-files-found: error
