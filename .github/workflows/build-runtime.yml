name: Build FFmpeg Runtime

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: "FFmpeg version"
        required: true
        default: "9.0.2"
  push:
    branches:
      - "main"
    tags:
      - "ffmpeg-*"

permissions:
  contents: write

env:
  FFMPEG_VERSION: "9.0.2"

jobs:
  windows-x64:
    name: Windows x64 LGPL runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             mingw-w64             yasm             nasm             pkg-config             curl             xz-utils             zip

      - name: Build FFmpeg
        env:
          TARGET: x86_64-w64-mingw32
        run: bash ./scripts/build-windows-x64.sh

      - name: Verify runtime
        run: bash ./scripts/verify-runtime.sh windows-x64

      - name: Package
        run: bash ./scripts/package-runtime.sh windows-x64

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-runtime-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64 LGPL runtime
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build FFmpeg
        run: bash ./scripts/build-macos.sh arm64

      - name: Verify runtime
        run: bash ./scripts/verify-runtime.sh macos-arm64

      - name: Package
        run: bash ./scripts/package-runtime.sh macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-runtime-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  macos-x64:
    name: macOS x64 LGPL runtime
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Build FFmpeg
        run: bash ./scripts/build-macos.sh x86_64

      - name: Verify runtime
        run: bash ./scripts/verify-runtime.sh macos-x64

      - name: Package
        run: bash ./scripts/package-runtime.sh macos-x64

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-runtime-macos-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/ffmpeg-')
    needs: [windows-x64, macos-arm64, macos-x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: ffmpeg-runtime-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: true
